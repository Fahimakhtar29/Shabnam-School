<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B6B3A" />
      <stop offset="100%" stop-color="#064223" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#F4B400" />
      <stop offset="100%" stop-color="#C99200" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1E5EFF" />
    </linearGradient>
  </defs>
  <!-- Outer Shield Frame -->
  <path d="M50,5 L88,20 V50 C88,72 70,90 50,95 C30,90 12,72 12,50 V20 Z" fill="url(#goldGrad)"/>
  <!-- Inner Shield -->
  <path d="M50,10 L83,23 V48 C83,68 67,84 50,89 C33,84 17,68 17,48 V23 Z" fill="url(#shieldGrad)"/>
  <!-- Sun behind book -->
  <circle cx="50" cy="42" r="16" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Open Book -->
  <path d="M28,48 Q50,44 50,54 Q50,44 72,48 V65 Q50,60 50,70 Q50,60 28,65 Z" fill="#FFFFFF"/>
  <path d="M50,54 V70" stroke="#0B6B3A" stroke-width="2" stroke-linecap="round"/>
  <!-- Torch flame -->
  <path d="M50,25 C47,29 46,31 50,34 C54,31 53,29 50,25 Z" fill="#EF4444"/>
</svg>
